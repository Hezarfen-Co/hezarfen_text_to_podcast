services:
  bridge:
    build:
      context: .
      dockerfile: Containerfile
      args:
        KUR_AGIR: ${KUR_AGIR:-1}
    # HEZARFEN_TAG deploy tarafindan yazilan stack.env'den gelir (--env-file);
    # laptopta/Windows'ta run-stack.ps1 `:current` isaretini kullanir, yani
    # env dosyasi yokken davranis eskisi gibi kalir.
    image: localhost/hezarfen-podcast:${HEZARFEN_TAG:-current}
    container_name: hezarfen_text_to_podcast
    # AGIR servis (8 GB mem_limit): ciplak `podman compose up` ile kalkmaz,
    # `--profile product` ister. Unit ve deploy bu profili gecer;
    # deploy/run-stack.ps1 ve deploy/rollback.ps1 de gecer. Kazara bir `up`,
    # canli stack'in RAM'ini sikistirmasin diye boyle.
    profiles: ["product"]
    init: true
    command: ["python", "-m", "src.bridge"]
    environment:
      AI_BRIDGE_HOST: hezarfen_backend
      AI_BRIDGE_PORT: "8090"
      AI_BACKEND_URL: http://hezarfen_backend:7656
      AI_SHARED_TOKEN: ${AI_SHARED_TOKEN:?AI_SHARED_TOKEN gerekli}
      AI_TLS_SERVER_NAME: localhost
      AI_SERVICE_NAME: podcast
      AI_MAX_CONCURRENT: "2"
      AI_RECONNECT_SECS: "3"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PODCAST_JOB_ROOT: /data/podcast/jobs
      PODCAST_WORKERS: "1"
      PODCAST_MAX_JOBS: "8"
      # Bitmis isleri ve ciktilarini kac gun sonra sil. 0 = ASLA silme.
      # Kodda varsayilan 0 (veri silmek opt-in olmali); dagitimda acik deger
      # verilir, yoksa podcast-out ve podcast-jobs suresiz buyur.
      PODCAST_RETENTION_DAYS: "30"
      PODCAST_STAGE_SECS: "0.2"
      PODCAST_ETA_SECS: "0"
      PODCAST_MEDIA_ROOT: /data/files
      # `simulate` = sahte hat (yalnizca kablo provasi), `real` = gercek is.
      PODCAST_MODE: ${PODCAST_MODE:-real}
      # `api` (VARSAYILAN) = yerli hat: PDF -> metin(+OCR) -> LLM script ->
      # ElevenLabs -> ffmpeg mux. vendor/pipeline GEREKTIRMEZ.
      # `local` = bugunku vendored Hat yolu (vendor/pipeline sart; yoksa
      # calisma aninda acik hata ile reddeder).
      PODCAST_ENGINE: ${PODCAST_ENGINE:-api}
      PODCAST_PIPELINE_PATH: ${PODCAST_PIPELINE_PATH:-/app/pipeline}
      PODCAST_OUTPUT_ROOT: /data/podcast/out
      PODCAST_LEDGER_DB: /data/podcast/kayit/router.sqlite
      PODCAST_CHAPTER_LIMIT: "1"
      PODCAST_CHAPTER_CHARS: "6000"
      PODCAST_MIN_TEXT_CHARS: "200"
      PODCAST_OCR_LANG: ${PODCAST_OCR_LANG:-tur}
      # Yalnizca LOKAL motorun TTS motoru (supertonic-3 = agsiz ONNX).
      # api motoru TTS'i ELEVENLABS_* ile yapar; bu anahtarlar ona dokunmaz.
      PODCAST_TTS_ENGINE: ${PODCAST_TTS_ENGINE:-supertonic-3}
      # Lokal motorun bulut TTS kapisi (api motoru bunu okumaz).
      SES_BULUT_IZINLI: ${SES_BULUT_IZINLI:-0}
      # OpenAI-uyumlu LLM ucu: filo sozlesmesi LLM_BASE_URL/LLM_MODEL/
      # LLM_API_KEY; baska saglayiciya yalnizca env ile gecilir.
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_EXTRA_JSON: ${LLM_EXTRA_JSON:-}
      ELEVENLABS_BASE_URL: ${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io}
      ELEVENLABS_MODEL: ${ELEVENLABS_MODEL:-eleven_flash_v2_5}
      ELEVENLABS_LANGUAGE: ${ELEVENLABS_LANGUAGE:-tr}
      ELEVENLABS_TIMEOUT_S: ${ELEVENLABS_TIMEOUT_S:-120}
      # Anahtarlar interpolasyonla gelir; compose'a literal sir YAZILMAZ.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      HF_HOME: /models/hf
      TORCH_HOME: /models/torch
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${HF_HUB_OFFLINE:-1}
    volumes:
      - hezarfen-data:/data:ro
      - podcast-jobs:/data/podcast/jobs
      - podcast-out:/data/podcast/out
      - podcast-kayit:/data/podcast/kayit
      - podcast-models:/models:ro
      - podcast-easyocr:/home/podcast/.EasyOCR
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "src.main", "--health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    mem_limit: 8g
    cpus: 4.0
    networks:
      - backend_net

volumes:
  podcast-jobs:
  podcast-out:
  podcast-kayit:
  podcast-models:
  podcast-easyocr:
  hezarfen-data:
    external: true
    name: ${HEZARFEN_DATA_VOLUME:-hezarfen_backend_hezarfen-data}

networks:
  backend_net:
    external: true
    name: ${HEZARFEN_NET:-hezarfen_backend_default}
